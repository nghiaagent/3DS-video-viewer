[package]
name = "stereo-disparity"
version = "0.1.0"
edition = "2021"
description = "High-performance stereo disparity estimation for Nintendo 3DS stereoscopic video"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
